<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Talents & Abilities Quest</title>
  <style>
    :root {
      --bg-color: #0d0f1d;
      --card-bg: rgba(23, 27, 52, 0.85);
      --accent-cyan: #00f2fe;
      --accent-magenta: #ff0844;
      --accent-green: #00e676;
      --accent-yellow: #ffea00;
      --text-color: #ffffff;
      --disabled-color: #3a3f58;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #1b1e38 0%, #0d0f1d 100%);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Game Container */
    .game-wrapper {
      width: 100%;
      max-width: 850px;
      background: var(--card-bg);
      border: 2px solid rgba(0, 242, 254, 0.3);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 0 40px rgba(0, 242, 254, 0.15), inset 0 0 15px rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
    }

    /* Top HUD */
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      background: rgba(0, 0, 0, 0.3);
      padding: 15px 20px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .level-badge {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .score-container {
      display: flex;
      gap: 20px;
      font-weight: 700;
    }

    .score-box {
      color: var(--accent-yellow);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Progress Bar */
    .progress-bar-bg {
      width: 100%;
      height: 12px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      margin-bottom: 30px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-magenta));
      transition: width 0.4s ease-out;
      box-shadow: 0 0 12px var(--accent-cyan);
    }

    /* Question Screen */
    .stage {
      text-align: center;
      margin-bottom: 30px;
    }

    .mascot-avatar {
      font-size: 3.5rem;
      animation: float 3s ease-in-out infinite;
      margin-bottom: 10px;
      display: inline-block;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .sentence-box {
      font-size: 1.4rem;
      line-height: 1.8;
      background: rgba(0, 0, 0, 0.4);
      padding: 25px;
      border-radius: 18px;
      border: 1px dashed rgba(0, 242, 254, 0.4);
      margin-bottom: 25px;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .blank-slot {
      display: inline-block;
      min-width: 180px;
      padding: 4px 15px;
      border-bottom: 3px solid var(--accent-cyan);
      color: var(--accent-yellow);
      font-weight: bold;
      transition: all 0.3s ease;
      background: rgba(0, 242, 254, 0.1);
      border-radius: 8px 8px 0 0;
      text-align: center;
    }

    .blank-slot.filled {
      border-bottom-color: var(--accent-magenta);
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.8); }
      100% { transform: scale(1); }
    }

    /* Options Grid */
    .options-title {
      font-size: 0.95rem;
      color: #a0a5c0;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .options-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-bottom: 30px;
    }

    .option-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-color);
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .option-btn:hover:not(:disabled) {
      transform: translateY(-3px) scale(1.03);
      border-color: var(--accent-cyan);
      background: rgba(0, 242, 254, 0.15);
      box-shadow: 0 6px 20px rgba(0, 242, 254, 0.3);
    }

    .option-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .option-btn:disabled {
      background: var(--disabled-color);
      color: #6c7293;
      border-color: transparent;
      cursor: not-allowed;
      opacity: 0.4;
      text-decoration: line-through;
      box-shadow: none;
    }

    /* Actions */
    .action-bar {
      display: flex;
      justify-content: center;
      gap: 15px;
    }

    .btn-main {
      background: linear-gradient(135deg, var(--accent-cyan), #0072ff);
      color: #fff;
      border: none;
      padding: 14px 35px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-main:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(0, 242, 254, 0.7);
    }

    .btn-main:disabled {
      background: #2a2e45;
      color: #555a77;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    /* Feedback Animations */
    .shake {
      animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes shake {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
    }

    /* Final Screen */
    .win-screen {
      text-align: center;
      padding: 20px 0;
      display: none;
    }

    .win-title {
      font-size: 2.5rem;
      color: var(--accent-green);
      margin-bottom: 15px;
      text-shadow: 0 0 20px var(--accent-green);
    }

    .win-stats {
      font-size: 1.3rem;
      margin-bottom: 25px;
      color: #d1d5db;
    }

    /* Canvas for Confetti */
    #canvas-fx {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="game-wrapper">
    <canvas id="canvas-fx"></canvas>

    <!-- Header / HUD -->
    <div class="hud">
      <div class="level-badge" id="level-indicator">Nivel 1 / 10</div>
      <div class="score-container">
        <div class="score-box">⭐ <span id="score">0</span> PTS</div>
      </div>
    </div>

    <!-- Progress Bar -->
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>

    <!-- Gameplay Area -->
    <div id="game-stage" class="stage">
      <div class="mascot-avatar" id="avatar">🎮</div>
      
      <div class="sentence-box" id="sentence-container">
        <!-- Generado dinámicamente -->
      </div>

      <div class="options-title">Elige el talento o habilidad adecuado:</div>
      <div class="options-grid" id="options-bank">
        <!-- Opciones dinámicas -->
      </div>

      <div class="action-bar">
        <button class="btn-main" id="check-btn" onclick="checkAnswer()" disabled>Comprobar</button>
      </div>
    </div>

    <!-- Game Over / Victory Screen -->
    <div id="win-screen" class="win-screen">
      <div style="font-size: 5rem; margin-bottom: 10px;">🏆</div>
      <h1 class="win-title">¡Misión Cumplida!</h1>
      <p class="win-stats">Has completado todos los ejercicios con éxito sobre <strong>Talents & Abilities</strong>.</p>
      <p style="font-size: 1.5rem; color: var(--accent-yellow); margin-bottom: 30px;">Puntuación Final: <span id="final-score">0</span> PTS</p>
      <button class="btn-main" onclick="restartGame()">Jugar de Nuevo 🔄</button>
    </div>
  </div>

  <script>
    // --- DATOS DEL JUEGO ---
    const questions = [
      { id: 1, before: "I can", after: "very fast, but I can’t play the piano.", answer: "play the guitar", icon: "🎸" },
      { id: 2, before: "They can", after: "pop lovely songs, but they can’t sing heavy metal songs.", answer: "sing", icon: "🎤" },
      { id: 3, before: "We can", after: "at the disco, but not in Math class.", answer: "dance", icon: "💃" },
      { id: 4, before: "I can’t", after: "Mexican food; I’m not good in the kitchen.", answer: "cook", icon: "🌮" },
      { id: 5, before: "I can", after: ", Spanish is easier but I’m improving every day.", answer: "speak another language", icon: "🗣️" },
      { id: 6, before: "I can’t", after: "but I can ride a horse.", answer: "ride a bicycle", icon: "🚲" },
      { id: 7, before: "To get my driver’s license I need to know how to", after: ".", answer: "drive a car", icon: "🚗" },
      { id: 8, before: "I’m a happier person when I", after: ", my favorite flavor is chocolate.", answer: "bake cakes", icon: "🧁" },
      { id: 9, before: "I can’t", after: "I hurt my knees when I fall down on the park.", answer: "skate", icon: "🛼" },
      { id: 10, before: "I can", after: "in English II if I study hard.", answer: "get a 100", icon: "💯" }
    ];

    const allOptions = [
      "play the guitar",
      "dance",
      "sing",
      "skate",
      "cook",
      "bake cakes",
      "drive a car",
      "ride a bicycle",
      "speak another language",
      "get a 100"
    ];

    // ESTADO DEL JUEGO
    let currentStep = 0;
    let selectedOption = null;
    let usedOptions = new Set();
    let score = 0;

    // AUDIO SYNTHESIZER (Web Audio API)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(type) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;

      if (type === 'select') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      } else if (type === 'correct') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now); // C5
        osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
        osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.35);
      } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.linearRampToValueAtTime(110, now + 0.25);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      } else if (type === 'win') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.setValueAtTime(554.37, now + 0.15);
        osc.frequency.setValueAtTime(659.25, now + 0.3);
        osc.frequency.setValueAtTime(880, now + 0.45);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.7);
        osc.start(now);
        osc.stop(now + 0.7);
      }
    }

    // INICIALIZACIÓN
    function initGame() {
      currentStep = 0;
      score = 0;
      usedOptions.clear();
      document.getElementById('score').innerText = score;
      document.getElementById('game-stage').style.display = 'block';
      document.getElementById('win-screen').style.display = 'none';
      loadQuestion();
    }

    function loadQuestion() {
      selectedOption = null;
      document.getElementById('check-btn').disabled = true;
      document.getElementById('check-btn').innerText = "Comprobar";

      const q = questions[currentStep];

      // HUD & Progress
      document.getElementById('level-indicator').innerText = `Nivel ${currentStep + 1} / ${questions.length}`;
      document.getElementById('progress-fill').style.width = `${((currentStep) / questions.length) * 100}%`;
      document.getElementById('avatar').innerText = q.icon;

      // Render Sentence
      const container = document.getElementById('sentence-container');
      container.innerHTML = `
        <span>${q.before}</span>
        <span class="blank-slot" id="blank-target">___________________</span>
        <span>${q.after}</span>
      `;

      // Render Options
      renderOptions();
    }

    function renderOptions() {
      const bank = document.getElementById('options-bank');
      bank.innerHTML = '';

      allOptions.forEach(option => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = option;

        // Deshabilitar si ya se usó correctamente en oraciones anteriores
        if (usedOptions.has(option)) {
          btn.disabled = true;
        } else {
          btn.onclick = () => selectOption(option);
        }

        if (selectedOption === option) {
          btn.style.borderColor = 'var(--accent-yellow)';
          btn.style.background = 'rgba(255, 234, 0, 0.2)';
        }

        bank.appendChild(btn);
      });
    }

    function selectOption(option) {
      playSound('select');
      selectedOption = option;

      const blank = document.getElementById('blank-target');
      blank.innerText = option;
      blank.classList.add('filled');

      document.getElementById('check-btn').disabled = false;
      renderOptions();
    }

    function checkAnswer() {
      const q = questions[currentStep];
      const stage = document.getElementById('sentence-container');

      if (selectedOption === q.answer) {
        // CORRECTO
        playSound('correct');
        triggerParticles();
        score += 100;
        document.getElementById('score').innerText = score;
        usedOptions.add(selectedOption);

        document.getElementById('check-btn').disabled = true;

        setTimeout(() => {
          currentStep++;
          if (currentStep < questions.length) {
            loadQuestion();
          } else {
            showWinScreen();
          }
        }, 1000);

      } else {
        // INCORRECTO
        playSound('wrong');
        stage.classList.add('shake');
        setTimeout(() => stage.classList.remove('shake'), 500);
      }
    }

    function showWinScreen() {
      playSound('win');
      document.getElementById('progress-fill').style.width = '100%';
      document.getElementById('game-stage').style.display = 'none';
      document.getElementById('win-screen').style.display = 'block';
      document.getElementById('final-score').innerText = score;
      triggerBigConfetti();
    }

    function restartGame() {
      initGame();
    }

    // EFECTOS VISUALES / PARTÍCULAS (CANVAS)
    const canvas = document.getElementById('canvas-fx');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let particles = [];

    function triggerParticles() {
      for (let i = 0; i < 30; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 10,
          vy: (Math.random() - 0.5) * 10,
          color: ['#00f2fe', '#ff0844', '#00e676', '#ffea00'][Math.floor(Math.random() * 4)],
          size: Math.random() * 6 + 3,
          alpha: 1
        });
      }
    }

    function triggerBigConfetti() {
      for (let i = 0; i < 100; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          vx: (Math.random() - 0.5) * 6,
          vy: Math.random() * 6 + 2,
          color: ['#00f2fe', '#ff0844', '#00e676', '#ffea00'][Math.floor(Math.random() * 4)],
          size: Math.random() * 8 + 4,
          alpha: 1
        });
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= 0.015;

        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();

        if (p.alpha <= 0) {
          particles.splice(index, 1);
        }
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // Arrancar el juego
    initGame();
  </script>
</body>
</html>
